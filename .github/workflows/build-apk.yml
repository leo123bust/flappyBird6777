name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Flutter project directory
        id: proj
        run: |
          # Търси директорията, в която се намира pubspec.yaml
          DIR=$(find . -name "pubspec.yaml" -maxdepth 2 -exec dirname {} \;)
          if [ -z "$DIR" ]; then
            DIR="."
          echo "Flutter project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generates a fresh android/ folder that matches the Flutter version used
      # here (avoids Gradle / Android Gradle Plugin version mismatches), then
      # re-applies the game's settings: label, portrait, min SDK 31, icons.
      - name: Prepare Android project
        working
